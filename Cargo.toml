[package]
name = "conductor-kit"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "conductor"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["clock", "serde"] }
crossterm = "0.28"
libc = "0.2"
portable-pty = "0.8"
ratatui = "0.29"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
